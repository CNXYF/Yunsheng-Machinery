<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 字符编码 -->
  <meta charset="UTF-8" />
  <!-- 响应式视口 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    SEO：由于产品详情页是动态加载，title 也会在下方 JS 中根据产品名动态更新。
    这里给一个默认值，防止 JS 加载失败时出现无意义标题。
  -->
  <title>产品详情 - 智享科技</title>
  <meta name="description" content="智享科技产品详情页，全面展示产品图片、视频、参数、优势与价格。" />
  <!-- 网站图标 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A1%3C/text%3E%3C/svg%3E" />

  <!-- 全局样式 -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 导航栏占位：由 common.js 动态渲染（产品下拉菜单可在各产品详情之间跳转） -->
  <div id="navbar-placeholder"></div>

  <main>
    <div class="container">
      <!-- =============================================================
           产品详情主容器
           所有内容均由下方 JS 动态渲染。
           如果 URL 参数中的 id 不存在，则显示"产品未找到"提示。
           ============================================================= -->
      <div id="productDetailRoot" class="product-detail">
        <!-- 加载中占位提示（JS 执行完成前短暂显示） -->
        <p style="text-align:center; color:#6B7280; padding:60px 0;">正在加载产品信息...</p>
      </div>
    </div>
  </main>

  <!-- 页脚占位：由 common.js 动态渲染 -->
  <div id="footer-placeholder"></div>

  <!-- 产品数据 + 工具函数（getProductById、getQueryParam） -->
  <script src="products-data.js"></script>
  <!-- 公共 JS：导航栏、页脚渲染 -->
  <script src="common.js"></script>

  <!-- 本页专属 JS：根据 URL 参数 id 加载并渲染产品详情 -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 1. 获取 URL 参数中的产品 id（例如 product.html?id=smart-watch-x1）
      const productId = getQueryParam("id");

      // 2. 根据 id 找到产品数据
      const product = productId ? getProductById(productId) : null;

      // 3. 若找不到产品：显示"未找到"友好提示
      if (!product) {
        renderNotFound();
        return;
      }

      // 4. 找到产品：更新页面标题、动态渲染完整详情内容
      document.title = product.name + " - 智享科技";
      renderProductDetail(product);
    });

    /* ============================================
       渲染"产品未找到"友好提示
       ============================================ */
    function renderNotFound() {
      const root = document.getElementById("productDetailRoot");
      root.innerHTML =
        '<div class="product-not-found">' +
          "<h2>产品不存在</h2>" +
          '<p>你访问的产品未找到，可能已下架或链接有误。</p>' +
          '<div style="margin-top:24px;">' +
            '<a href="products.html" class="btn btn-primary">返回产品列表</a>' +
          "</div>" +
        "</div>";
    }

    /* ============================================
       渲染完整的产品详情页内容
       参数：product（从 products-data.js 取到的单条产品数据）
       ============================================ */
    function renderProductDetail(product) {
      const root = document.getElementById("productDetailRoot");

      // ======= 预先准备图片数组（防御性处理） =======
      const images = product.images && product.images.length > 0
        ? product.images
        : ["https://placehold.co/800x500?text=No+Image"];

      // ======= 预先准备产品优势数组（防御性处理） =======
      const advantages = product.advantages && product.advantages.length > 0
        ? product.advantages
        : ["品质可靠，值得信赖"];

      // ======= 预先准备产品规格数组（防御性处理） =======
      const specs = product.specs && product.specs.length > 0
        ? product.specs
        : ["暂无详细参数，请联系客服咨询"];

      // ======= 描述文本：将 \n\n 分段转为多个 <p> 标签 =======
      const descriptionHtml = (product.description || "")
        .split(/\n{2,}/)        // 按 2 个以上换行符分段
        .filter(function (p) { return p.trim() !== ""; }) // 去掉空段
        .map(function (para) {
          // 段内的单个换行转换为 <br>
          const content = para.replace(/\n/g, "<br>");
          return "<p>" + content + "</p>";
        })
        .join("");

      // ======= 规格参数列表 HTML =======
      const specsHtml = specs
        .map(function (s) { return "<li>" + s + "</li>"; })
        .join("");

      // ======= 产品优势列表 HTML =======
      const advantagesHtml = advantages
        .map(function (a) { return "<li>" + a + "</li>"; })
        .join("");

      // ======= 缩略图 HTML（用于图片下方多图切换） =======
      const thumbnailsHtml = images
        .map(function (src, idx) {
          // 第一张默认激活
          const activeClass = idx === 0 ? "active" : "";
          return (
            '<div class="thumb ' + activeClass + '" data-index="' + idx + '">' +
              '<img src="' + src + '" alt="缩略图' + (idx + 1) + '" />' +
            "</div>"
          );
        })
        .join("");

      // ======= 组合最终 HTML =======
      root.innerHTML =
        // 1. 页面顶部：产品名称标题
        "<h1>" + product.name + "</h1>" +

        // 2. 左右两栏：左图片 + 右视频
        '<div class="media-grid">' +
          // --- 左栏：图片（大图 + 缩略图切换） ---
          '<div class="media-left">' +
            // 主图显示区（第一张图默认显示）
            '<div class="main-image" id="mainImageWrap">' +
              '<img id="mainImage" src="' + images[0] + '" alt="' + product.name + '" />' +
            "</div>" +
            // 缩略图点击切换
            '<div class="thumbnails" id="thumbnails">' + thumbnailsHtml + "</div>" +
          "</div>" +

          // --- 右栏：内置 HTML5 视频播放器（带 controls 控件） ---
          '<div class="media-right">' +
            "<h3>🎬 产品视频</h3>" +
            '<video controls preload="metadata" poster="' + images[0] + '">' +
              '<source src="' + product.video + '" type="video/mp4" />' +
              // 浏览器不支持 video 标签时的回退文本
              "您的浏览器不支持 HTML5 视频播放，请升级浏览器版本。" +
            "</video>" +
          "</div>" +
        "</div>" +

        // 3. 产品介绍文本框（详细描述、参数、优势、价格 + 购买按钮）
        '<div class="info-panel">' +
          // --- 详细产品描述 ---
          '<div class="info-block">' +
            "<h2>产品介绍</h2>" +
            descriptionHtml +
          "</div>" +

          // --- 产品参数 ---
          '<div class="info-block">' +
            "<h2>产品参数</h2>" +
            '<ul class="specs-list">' + specsHtml + "</ul>" +
          "</div>" +

          // --- 产品优势 ---
          '<div class="info-block">' +
            "<h2>产品优势</h2>" +
            '<ul class="advantages-list">' + advantagesHtml + "</ul>" +
          "</div>" +

          // --- 价格 + 购买按钮 ---
          '<div class="purchase-bar">' +
            '<div class="price">' +
              product.price +
              "<small>含税包邮</small>" +
            "</div>" +
            '<div class="actions">' +
              // 模拟"咨询客服"跳转
              '<a href="contact.html" class="btn btn-outline">咨询客服</a>' +
              // 模拟购买按钮（真实环境可对接电商平台或购物车）
              '<button type="button" class="btn btn-accent" id="buyBtn">' +
                "立即购买" +
              "</button>" +
            "</div>" +
          "</div>" +
        "</div>";

      // ======= 渲染完成后绑定交互事件 =======
      bindDetailInteractions();
    }

    /* ============================================
       绑定产品详情页交互：
       1) 缩略图点击切换主图
       2) "立即购买"按钮点击
       ============================================ */
    function bindDetailInteractions() {
      // --- 1) 缩略图点击切换主图 ---
      const mainImage = document.getElementById("mainImage");
      const thumbContainer = document.getElementById("thumbnails");

      if (mainImage && thumbContainer) {
        // 取出所有缩略图的 img src（按顺序，方便通过索引切换）
        const thumbs = thumbContainer.querySelectorAll(".thumb");
        const srcList = [];
        thumbs.forEach(function (t) {
          const img = t.querySelector("img");
          if (img) srcList.push(img.src);
        });

        // 委托方式：点击缩略图容器中任意 .thumb 即可切换
        thumbContainer.addEventListener("click", function (e) {
          // 向上找到 .thumb 元素
          const thumbEl = e.target.closest(".thumb");
          if (!thumbEl) return;

          const idx = parseInt(thumbEl.getAttribute("data-index"), 10);
          if (isNaN(idx) || idx < 0 || idx >= srcList.length) return;

          // 切换主图
          mainImage.src = srcList[idx];

          // 更新"激活"缩略图的高亮样式
          thumbs.forEach(function (t) { t.classList.remove("active"); });
          thumbEl.classList.add("active");
        });
      }

      // --- 2) "立即购买"按钮点击（演示：弹出提示，真实场景可跳电商/购物车） ---
      const buyBtn = document.getElementById("buyBtn");
      if (buyBtn) {
        buyBtn.addEventListener("click", function () {
          alert(
            "感谢您的购买意向！\n\n" +
            "此演示站点尚未接入真实电商系统。\n" +
            "如需购买，请通过【联系我们】页面与我们取得联系，或前往我们的官方商城。"
          );
        });
      }
    }
  </script>
</body>
</html>
