name: 发布云升机械网站到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 构建脱敏后的静态网站
        run: python build_pages.py
      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4

