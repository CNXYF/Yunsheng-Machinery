<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>网站内容管理 | 云升机械</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin-accounts.css">
</head>
<body class="admin-body">
  <header class="top admin-top">
    <a class="brand" href="/"><span class="brandmark">云</span><span>云升机械<small>内容管理后台</small></span></a>
    <a href="/" class="text-link">查看网站 ↗</a>
  </header>
  <main class="admin-wrap">
    <section id="loginPanel" class="login-panel">
      <span class="eyebrow">YUNSHENG CMS</span><h1>管理员登录</h1>
      <p>登录后即可修改网站内容、产品及查看询盘。</p>
      <form id="loginForm">
        <label>管理员账号<input name="username" required autocomplete="username" placeholder="请输入管理员账号"></label>
        <label>管理员密码<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="button primary">登录后台 ↗</button><p id="loginError" role="status"></p>
      </form>
    </section>
    <section id="cmsPanel" hidden>
      <div class="cms-heading">
        <div><span class="eyebrow">CONTENT MANAGEMENT</span><h1>网站内容管理</h1><p id="adminIdentity" class="cms-help"></p></div>
        <button class="button ghost" id="logout">退出登录</button>
      </div>
      <div class="cms-toolbar">
        <label>管理栏目<select id="sectionSelect">
          <option value="dashboard">管理概览</option><option value="settings">网站信息与首页设置</option>
          <option value="products">产品管理</option><option value="categories">产品分类</option>
          <option value="news">新闻动态</option><option value="cases">客户案例</option>
          <option value="credentials">资质荣誉</option><option value="inquiries">快捷询盘</option>
          <option value="contacts">联系登记与跟进</option><option value="admins" hidden>管理员账号管理</option>
        </select></label>
        <div><button class="button ghost" id="addItem">＋ 新增内容</button> <button class="button primary" id="saveAll">保存所有修改</button></div>
      </div>
      <p class="cms-help">编辑内容后点击“保存所有修改”；产品和新闻可保存为草稿或发布。联系登记的跟进状态、负责人和备注使用“保存跟进信息”。</p>
      <div id="editor"></div>
    </section>
  </main>
  <script src="config.js"></script><script src="admin.js"></script>
</body>
</html>
