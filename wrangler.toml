# Cloudflare Pages 项目绑定：按《Cloudflare 全迁移说明》创建 D1 与 R2 后替换数据库 ID。
name = "yunsheng-machinery-site"
compatibility_date = "2026-10-31"
pages_build_output_dir = "_site"

[[d1_databases]]
binding = "DB"
database_name = "yunsheng-site"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "yunsheng-media"

[vars]
ADMIN_USERNAME = "admin"
